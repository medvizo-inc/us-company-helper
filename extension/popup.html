<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>US Company Helper</title>
    <style>
      :root {
        --bg: #f9f8f4;
        --card: #ffffff;
        --inset: #f3f1ea;
        --text: #0c1b3a;
        --muted: #545d70;
        --line: #e6e4dd;
        --line-strong: #d6d3c9;
        --brass: #e0ac3c;
        --brass-soft: #fbf0d6;
        --brass-text: #7a5a10;
        --ok: #1f7a4d;
        --ok-soft: #e3f3ea;
        --focus: rgba(224, 172, 60, 0.45);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1630;
          --card: #112040;
          --inset: #0e1b36;
          --text: #f4f2ec;
          --muted: #a7afc2;
          --line: #22335a;
          --line-strong: #2d4170;
          --brass-soft: rgba(224, 172, 60, 0.16);
          --brass-text: #e9c26d;
          --ok: #6fd3a0;
          --ok-soft: rgba(111, 211, 160, 0.14);
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--line);
      }
      header img {
        width: 28px;
        height: 28px;
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .lede {
        margin: 1px 0 0;
        color: var(--muted);
        font-size: 11.5px;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 14px 16px;
      }
      .field label {
        display: block;
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .row {
        display: flex;
        align-items: stretch;
        gap: 6px;
      }
      input,
      textarea {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      textarea {
        resize: vertical;
        min-height: 58px;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
        opacity: 0.75;
      }
      input:focus,
      textarea:focus {
        border-color: var(--brass);
        box-shadow: 0 0 0 3px var(--focus);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.03em;
      }

      button.copy {
        flex: none;
        width: 66px;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        background: var(--inset);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      button.copy:hover:not(:disabled) {
        border-color: var(--brass);
        background: var(--brass-soft);
        color: var(--brass-text);
      }
      button.copy:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--focus);
      }
      button.copy:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      button.copy.done {
        border-color: var(--ok);
        background: var(--ok-soft);
        color: var(--ok);
      }

      .note {
        margin: 0;
        color: var(--muted);
        font-size: 11.5px;
      }
      .saved {
        min-height: 16px;
        color: var(--ok);
        font-size: 11.5px;
        transition: opacity 0.3s;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px 12px;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      footer a {
        color: var(--brass-text);
        font-weight: 600;
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }

      /* Fields the person adds: the name is typed in, where a label would be. */
      .custom {
        display: grid;
        gap: 12px;
      }
      .custom:empty {
        display: none;
      }
      .custom .head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 5px;
      }
      input.name {
        flex: 1;
        padding: 2px 4px;
        margin-left: -4px;
        border-color: transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      input.name:hover {
        border-color: var(--line-strong);
      }
      input.name::placeholder {
        text-transform: none;
        letter-spacing: 0;
        font-weight: 500;
      }
      button.remove {
        flex: none;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      button.remove:hover,
      button.remove:focus-visible {
        outline: none;
        background: var(--inset);
        color: var(--text);
      }
      button.add {
        padding: 8px 10px;
        border: 1px dashed var(--line-strong);
        border-radius: 9px;
        background: transparent;
        color: var(--brass-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.add:hover,
      button.add:focus-visible {
        outline: none;
        border-color: var(--brass);
        background: var(--brass-soft);
      }
      button.add:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .saved button {
        margin-left: 6px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--brass-text);
        font: inherit;
        font-weight: 600;
        text-decoration: underline;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <div>
        <h1>US Company Helper</h1>
        <p class="lede">Your company's details, one click to copy.</p>
      </div>
    </header>

    <main>
      <div class="field">
        <label for="companyName">Company name</label>
        <div class="row">
          <input id="companyName" type="text" autocomplete="off" spellcheck="false" placeholder="Acme Labs LLC" />
          <button class="copy" type="button" data-for="companyName">Copy</button>
        </div>
      </div>

      <div class="field">
        <label for="ein">EIN</label>
        <div class="row">
          <input id="ein" class="mono" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="10" placeholder="12-3456789" />
          <button class="copy" type="button" data-for="ein">Copy</button>
        </div>
      </div>

      <div class="field">
        <label for="address">Corporate address</label>
        <div class="row">
          <textarea id="address" rows="3" autocomplete="off" spellcheck="false" placeholder="123 Main St, Ste 100&#10;Sheridan, WY 82801"></textarea>
          <button class="copy" type="button" data-for="address">Copy</button>
        </div>
      </div>

      <div class="field">
        <label for="phone">US phone number</label>
        <div class="row">
          <input id="phone" class="mono" type="tel" autocomplete="off" spellcheck="false" placeholder="+1 307 555 0142" />
          <button class="copy" type="button" data-for="phone">Copy</button>
        </div>
      </div>

      <div id="custom" class="custom"></div>

      <button id="addField" class="add" type="button">+ Add a field</button>

      <p class="note">Saved in this browser only. Nothing is sent anywhere.</p>
      <div class="saved" id="saved" aria-live="polite"></div>
    </main>

    <footer>
      <span>Made by BaseAcross</span>
      <a href="https://baseacross.com/?utm_source=chrome-extension&utm_medium=extension&utm_campaign=us-company-helper" target="_blank" rel="noopener noreferrer">baseacross.com</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
